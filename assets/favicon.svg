<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Site icon: a planet with a tilted orbit and a satellite, in the site's periwinkle.
       The ring is drawn whole, then its near (lower) half again over the planet. -->
  <rect width="64" height="64" rx="14" fill="#0a1022"/>
  <g transform="rotate(-24 32 32)">
    <ellipse cx="32" cy="32" rx="25" ry="10" fill="none" stroke="#91a7ff" stroke-width="3.5"/>
    <circle cx="32" cy="32" r="10.5" fill="#91a7ff"/>
    <path d="M21.5 32a10.5 10.5 0 0 0 21 0z" fill="#5c7cfa"/>
    <path d="M7 32a25 10 0 0 0 50 0" fill="none" stroke="#91a7ff" stroke-width="3.5"/>
    <circle cx="16" cy="39.6" r="4.2" fill="#ffffff"/>
  </g>
</svg>
